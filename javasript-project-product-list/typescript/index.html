<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <!-- bootstrape link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- css link -->
    <link rel="stylesheet" href="./style.css">

    <!-- remix icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <header class="mt-3">
        <div class="container">
            <div class="row">
                <div class="head border-bottom">
                    <div class="col-12">
                        <div class="header d-flex justify-content-between">
                            <div class="col-2">
                                <div class="logo">
                                    <h3 class="fw-semibold">ShopHub</h3>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="search">
                                    <form class="d-flex" role="search">
                                        <input class="form-control me-2" type="search" placeholder="Search Product"
                                            aria-label="Search" />
                                        <!-- <button class="btn btn-outline-success" type="submit">Search</button> -->
                                    </form>
                                </div>
                            </div>
                            <div class="col-2">
                                <div class="nav-icon">
                                    <ul class="d-flex list-unstyled fs-4 justify-content-evenly">
                                        <li><i class="ri-poker-hearts-line"></i></li>
                                        <li><i class="ri-user-line"></i></li>
                                        <li><i class="ri-shopping-cart-2-line"></i></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>

        <!-- navbar -->
        <section class="border-bottom">
            <div class="container">
                <div class="row">
                    <div class="navbar">
                        <div class="col-8 mx-auto">
                            <nav class="nav-menu">
                                <ul class="list-unstyled d-flex justify-content-around fw-semibold fs-5">
                                    <li>Home</li>
                                    <li>Product</li>
                                    <li>New Collection</li>
                                    <li>About</li>
                                    <li>Contact</li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
